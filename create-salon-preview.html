<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<title>پیشنمایش — /dashboard/setup?new=1</title>
<style>
  body { font-family:'Vazirmatn', system-ui, Tahoma, sans-serif; }
  .step-enter { animation: stepEnter .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes stepEnter { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
</style>
</head>
<body class="min-h-screen bg-neutral-100">

  <div class="mx-auto max-w-3xl px-4 py-10">

    <!-- برندینگ -->
    <div class="mb-8 text-center">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-pink-500 to-purple-600 text-2xl text-white shadow-lg">💈</div>
      <h1 class="mt-4 text-2xl font-black text-neutral-900">راهاندازی سالن شما</h1>
      <p class="mt-2 text-sm text-neutral-500">ابتدا سالن را بسازید؛ سپس مراحل تکمیل را ادامه دهید.</p>
    </div>

    <!-- نوار پیشرفت -->
    <div class="mb-6">
      <div class="mb-1.5 flex items-center justify-between text-xs font-bold text-neutral-500">
        <span>۰ از ۶</span>
        <span class="text-pink-600">💈 شروع</span>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-neutral-200">
        <div class="h-full w-1/6 rounded-full bg-gradient-to-l from-pink-500 to-purple-600"></div>
      </div>
    </div>

    <!-- چیپ‌های مراحل -->
    <div class="mb-6 flex flex-wrap items-center justify-center gap-2">
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>👤</span><span>پروفایل کاری</span></span>
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>🌐</span><span>لینکهای آنلاین</span></span>
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>📍</span><span>موقعیت مکانی</span></span>
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>⏰</span><span>ساعات و قوانین</span></span>
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>✂️</span><span>خدمات و کارکنان</span></span>
      <span class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-white px-3 text-xs font-bold text-neutral-500 opacity-70 shadow-sm"><span>🚀</span><span>پایان</span></span>
    </div>

    <!-- کارت ساخت سالن -->
    <div class="step-enter rounded-3xl border border-neutral-200 bg-white p-6 shadow-xl">
      <div class="space-y-4">
        <div>
          <label class="mb-1 block text-xs font-bold text-neutral-500">نام سالن *</label>
          <input class="h-11 w-full rounded-xl border border-neutral-200 bg-white px-3.5 text-sm" placeholder="مثلاً آرایشگاه مهرازا" />
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-xs font-bold text-neutral-500">شماره تلفن *</label>
            <input class="h-11 w-full rounded-xl border border-neutral-200 bg-white px-3.5 text-sm" dir="ltr" placeholder="02112345678" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-bold text-neutral-500">شهر</label>
            <input class="h-11 w-full rounded-xl border border-neutral-200 bg-white px-3.5 text-sm" placeholder="تهران" />
          </div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-bold text-neutral-500">آدرس</label>
          <input class="h-11 w-full rounded-xl border border-neutral-200 bg-white px-3.5 text-sm" placeholder="تهران، سعادتآباد..." />
        </div>
        <button class="h-12 w-full rounded-xl bg-[#1c2434] font-black text-white transition hover:bg-[#2a3450]">ساخت سالن و ادامه</button>
      </div>
    </div>

    <p class="mt-8 text-center text-[11px] text-neutral-400">پیشنمایش حالت ?new=1 — همان اسکلت ویزارد، فرم خالی.</p>
  </div>

</body>
</html>
