# Nobino — اجرای کامل روی سرور داکردار (اپ + PostgreSQL)
#
# ۱) کپی متغیرها:      cp deploy/env.production.example .env   (و مقدارها را پر کنید)
# ۲) بالا آوردن:        docker compose up -d --build
# ۳) سلامت:            curl http://localhost:3100/api/health?db=1
# ۴) لاگ:              docker compose logs -f app
#
# نکته: دامنهٔ ریشه (ROOT_DOMAIN) و رمزها را در همان .env بگذارید؛ compose
# DATABASE_URL را از POSTGRES_* برای شبکهٔ داخلی کانتینر می‌سازد و مقدار
# localhostِ موجود در .env هرگز به داخل کانتینر نمی‌رود. برای دیتابیس بیرونی
# (managed) به‌جای DATABASE_URL، متغیر APP_DATABASE_URL را در .env بگذارید.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nobino}
      POSTGRES_USER: ${POSTGRES_USER:-nobino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env بگذارید}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nobino} -d ${POSTGRES_DB:-nobino}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # پیش‌فرض فقط داخل شبکهٔ داکر در دسترس است؛ برای دسترسی بیرونی پورت را باز کنید
    # ports:
    #   - "127.0.0.1:5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # دامنهٔ بیلد SPA: VITE_ROOT_DOMAIN/VITE_SITE_URL از همان .env خوانده
      # می‌شوند (خلاف آن .dockerignore اجازهٔ رسیدن .env به vite build را نمی‌دهد).
      args:
        SITE_URL: ${SITE_URL:-}
        VITE_ROOT_DOMAIN: ${ROOT_DOMAIN:-}
        VITE_SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # ⚠️ این خط همیشه بر env_file غلبه می‌کند (compose، environment را برتر
      # می‌گیرد). پس در داخل کانتینر DATABASE_URL هرگز از .env خوانده نمی‌شود؛
      # دلیل: قالب deploy/env.production.example یک نشانی localhost:5432 دارد
      # که داخل کانتینر به هیچ دیتابیسی نمی‌رسد و app در crash-loop می‌افتد.
      #   • دیتابیس همین compose (پیش‌فرض) → از POSTGRES_* و نام سرویس «db» ساخته می‌شود.
      #   • دیتابیس managed/خارجی          → APP_DATABASE_URL را در .env بگذارید.
      # (متغیر را APP_DATABASE_URL نامیم تا مقدار localhost خودِ DATABASE_URL
      #  نتواند این پیش‌فرض را باطل کند.)
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-nobino}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nobino}?schema=public}
      PORT: "3100"
      HOST: 0.0.0.0
      SERVE_FRONTEND: "1"
    ports:
      - "${APP_PORT:-3100}:3100"
    volumes:
      # آپلودهای محلی (اگر BLOB_READ_WRITE_TOKEN ست نشده باشد) بین restartها می‌مانند
      - uploads:/app/public/uploads
      - voice:/app/public/voice
      # مدل محلی ASR (Shenava/sherpa-onnx) — در اولین بوت خودکار دانلود و اینجا
      # نگه‌داری می‌شود؛ نیازی به دانلود دستی روی میزبان نیست. (جایگزین: bind mount
      # ./models:/app/models با مالکیت قابل‌نوشتن برای uid=1001)
      - asr_models:/app/models
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  uploads:
  voice:
  asr_models:
